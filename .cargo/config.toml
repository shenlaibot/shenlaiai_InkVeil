# 国内镜像：crates.io 直连在本网络环境不可达，统一走 rsproxy 稀疏索引。
# 供应链说明：依赖完整性由 Cargo.lock 中的 checksum 校验，镜像不能篡改内容；
# 但 CI 不应依赖第三方镜像——.github/workflows 里会在构建前删除本文件，直连官方 crates.io。
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "https://rsproxy.cn/crates.io-index"

[net]
git-fetch-with-cli = true
