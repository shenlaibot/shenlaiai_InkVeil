[package]
name = "anonkit"
version = "0.1.5"
license-file = "../LICENSE"
description = "墨隐 InkVeil - 开源 AI 法律本地脱敏工具（本地文档脱敏桌面应用）"
authors = ["InkVeil Team"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anonkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt-multi-thread", "fs", "sync"] }
sha2 = "0.10"
rand = "0.8"
# 审计日志与应用配置的本地持久化（bundled SQLite，无需系统依赖）
rusqlite = { version = "0.40", features = ["bundled"] }

# 工作区内部 crate
anonymizer-core = { path = "../crates/anonymizer-core" }
anonymizer-pipeline = { path = "../crates/anonymizer-pipeline" }
