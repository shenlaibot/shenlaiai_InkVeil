# 所有 Action 以 commit SHA 固定。签名/公证步骤见 docs/release.md（尚未接入，待办）。
# 三平台安装包构建：macOS（dmg）+ Windows（NSIS exe）+ Linux（deb/AppImage）。
# 触发：打 tag（v*）或手动 dispatch。产物在 Actions 的 Artifacts 中下载。
# 需要打包 updater 签名产物（*.sig）时，在仓库 Settings → Secrets 配置：
#   TAURI_SIGNING_PRIVATE_KEY      = keys/updater.key 内容（OTA 签名）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 密钥口令
# 未配置时自动降级：跳过 updater 签名，仅产出安装包，构建不失败。
name: build-installers

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 分支快照
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: 移除本地镜像配置（CI 用官方 crates.io）
        shell: bash
        run: rm -f .cargo/config.toml
      - name: 安装前端依赖
        run: npm ci
      - name: 构建 sidecar（PyInstaller）
        run: |
          python -m venv sidecar/.venv
          sidecar/.venv/bin/python -m pip install --require-hashes -r sidecar/requirements-build.lock
          bash scripts/build-sidecar.sh
      - name: 打包应用（dmg + updater 产物）
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 未配置 Developer ID 时回退为临时签名（"-"），否则 Apple Silicon 上未签名应用会提示"已损坏"。
          # 配置了 APPLE_SIGNING_IDENTITY（证书 SHA-1 或名称）即按 Developer ID 签名；公证另需 APPLE_ID 等，见 docs/release.md。
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: |
          set -e
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npm run tauri build
          else
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，跳过 updater 签名（仅产出安装包）"
            npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: 冒烟：运行打包后的 sidecar
        shell: bash
        run: sidecar/.venv/bin/python scripts/smoke_bundled_sidecar.py target/release/bundle/macos/InkVeil.app/Contents/MacOS/anonkit-sidecar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-installers
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.sig

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 分支快照
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: 移除本地镜像配置（CI 用官方 crates.io）
        shell: bash
        run: rm -f .cargo/config.toml
      - name: 安装前端依赖
        run: npm ci
      - name: 构建 sidecar（PyInstaller）
        shell: bash
        run: |
          python -m venv sidecar/.venv
          sidecar/.venv/Scripts/python.exe -m pip install --require-hashes -r sidecar/requirements-build.lock
          bash scripts/build-sidecar.sh
      - name: 打包应用（NSIS exe + updater 产物）
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npm run tauri build
          else
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，跳过 updater 签名（仅产出安装包）"
            npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: 冒烟：运行打包后的 sidecar
        shell: bash
        run: sidecar/.venv/Scripts/python.exe scripts/smoke_bundled_sidecar.py target/release/anonkit-sidecar.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.sig

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 分支快照
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: 移除本地镜像配置（CI 用官方 crates.io）
        shell: bash
        run: rm -f .cargo/config.toml
      - name: 安装前端依赖
        run: npm ci
      - name: 构建 sidecar（PyInstaller）
        run: |
          python3 -m venv sidecar/.venv
          sidecar/.venv/bin/python -m pip install --require-hashes -r sidecar/requirements-build.lock
          bash scripts/build-sidecar.sh
      - name: 打包应用（AppImage + deb）
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npm run tauri build -- --bundles deb appimage
          else
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，跳过 updater 签名（仅产出安装包）"
            npm run tauri build -- --bundles deb appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: 冒烟：运行打包后的 sidecar
        shell: bash
        run: sidecar/.venv/bin/python scripts/smoke_bundled_sidecar.py target/release/anonkit-sidecar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-installers
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.sig